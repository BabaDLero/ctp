version: 2

# Exposures = the things OUTSIDE dbt that use our models (dashboards, reports, ML models).
# They appear at the end of the lineage graph: impact analysis starts here.
exposures:
  - name: sales_dashboard
    label: Sales dashboard (Metabase)
    type: dashboard
    maturity: high
    owner:
      name: Sara Martin
      email: sara.martin@shopfast.example
    depends_on:
      - ref('fct_orders')
    description: "Daily revenue, orders and conversion per channel. Opened every morning by the CEO."

  - name: finance_monthly_revenue_report
    label: Finance monthly revenue report (board)
    type: dashboard
    maturity: high
    owner:
      name: Paul Girard
      email: paul.girard@shopfast.example
    depends_on:
      - ref('fct_orders')
    description: "Monthly net revenue (excluding VAT, after refunds) and year-over-year comparison for the board and the annual accounts. Refreshed on the 1st of each month."

  - name: churn_prediction_model
    label: Churn prediction model (ML)
    type: ml
    maturity: medium
    owner:
      name: Sara Martin
      email: sara.martin@shopfast.example
    depends_on:
      - ref('dim_customers')
    description: "Gradient-boosting model scoring each customer's churn probability every week from lifetime_orders, last_order_date, lifetime_net_revenue_eur and loyalty_tier; output feeds marketing campaigns (only customers with marketing consent)."
